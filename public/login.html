<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TrilhaSonora</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(ellipse at top, rgba(34, 197, 94, 0.22), transparent 55%), #121212;
        }

        .card {
            width: 100%;
            max-width: 340px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo {
            display: block;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .logo span {
            color: #22c55e;
        }

        h1 {
            font-size: 19px;
            text-align: center;
            margin-bottom: 8px;
        }

        .sub {
            font-size: 12px;
            color: #b3b3b3;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .campo {
            position: relative;
            margin-bottom: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 38px;
            background: #242424;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0 40px 0 12px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        input::placeholder {
            color: #737373;
        }

        input:focus {
            border-color: #22c55e;
        }

        .olho {
            position: absolute;
            right: 8px;
            top: 4px;
            width: 30px;
            height: 30px;
            background: none;
            border: none;
            cursor: pointer;
            color: #b3b3b3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 16px;
        }

        .linha label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            margin: 0;
            cursor: pointer;
        }

        .linha input {
            accent-color: #22c55e;
        }

        a {
            color: #22c55e;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            height: 38px;
            background: #22c55e;
            color: #000;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: #4ade80;
        }

        #div_msg {
            font-size: 12px;
            text-align: center;
            min-height: 16px;
            margin-bottom: 10px;
        }

        .rodape {
            font-size: 12px;
            color: #b3b3b3;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>

<body>

    <div class="card">
        <a href="home.html" class="logo">Trilha<span>Sonora</span></a>

        <h1>Que bom ter você de volta!</h1>
        <p class="sub">Entre na sua conta e continue compartilhando suas histórias musicais.</p>

        <label for="ipt_email">E-mail</label>
        <div class="campo">
            <input type="text" id="ipt_email" placeholder="voce@exemplo.com">
        </div>

        <label for="ipt_senha">Senha</label>
        <div class="campo">
            <input type="password" id="ipt_senha" placeholder="Sua senha">
            <button type="button" class="olho" onclick="verSenha()" aria-label="Mostrar senha">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>

        <div class="linha">
            <label><input type="checkbox" id="chk_manter" checked> Manter conectado</label>
            <a href="#">Esqueceu sua senha?</a>
        </div>

        <div id="div_msg"></div>

        <button class="btn" onclick="entrar()">Entrar</button>

        <p class="rodape">Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
    </div>

</body>

<script>
    // mostra ou esconde a senha
    function verSenha() {
        if (ipt_senha.type === 'password') {
            ipt_senha.type = 'text';
        } else {
            ipt_senha.type = 'password';
        }
    }

    function entrar() {
        let email = ipt_email.value;
        let senha = ipt_senha.value;

        div_msg.style.color = '#f87171';

        if (email === '' || senha === '') {
            div_msg.innerHTML = 'Preencha o e-mail e a senha.';
        } else if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
            div_msg.innerHTML = 'Digite um e-mail válido.';
        } else {
            div_msg.style.color = '#22c55e';
            div_msg.innerHTML = 'Entrando...';

            // depois, aqui entra a verificação com o banco de dados
            setTimeout(function () {
                window.location.href = 'home.html';
            }, 1000);
        }
    }
</script>

</html>
